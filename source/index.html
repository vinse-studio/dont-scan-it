<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DON'T SCAN IT v1.10 — VINSE Studio</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050806;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: "Courier New", Courier, monospace;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 100%;
      display: flex;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      background: #050806;
    }
    canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      max-width: none;
      max-height: none;
      image-rendering: pixelated;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
